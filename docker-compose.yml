# version: '3.8'

services:
  omniparser:
    build:
      context: ./src/omniparser
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SOM_MODEL_PATH=weights/icon_detect/model.pt
      - CAPTION_MODEL_NAME=florence2
      - CAPTION_MODEL_PATH=weights/icon_caption_florence
      - DEVICE=cuda
      - BOX_THRESHOLD=0.05
      - OMNIPARSER_HOST=0.0.0.0  # Changed to 0.0.0.0 to allow external connections
      - OMNIPARSER_PORT=8081
      - PYTHONPATH=/app
    volumes:
      - ./src/omniparser/weights:/app/weights
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/test_result_image/"]
      interval: 600s
      timeout: 10s
      retries: 3
      start_period: 40s

  orchestrator:
    build:
      context: ./src/orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    # depends_on:
      # - omniparser
      # - postgresql_db
    environment:
      - OMNIPARSER_HOST=omniparser  
      - OMNIPARSER_PORT=8081
      - OMNIPARSER_ENABLE=True
      - CHAT_COMPLETION_ENABLE=True
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME:-}
      - AZURE_OPENAI_CHAT_DEPLOYMENT_NAME=${AZURE_OPENAI_CHAT_DEPLOYMENT_NAME:-gpt-6.1-sol}
      - AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME=${AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:-text-embedding-3-large}
      - AZURE_AI_AGENT_CHAT_MODEL_DEPLOYMENT_NAME=${AZURE_AI_AGENT_CHAT_MODEL_DEPLOYMENT_NAME:-gpt-6.1-sol}
      - AZURE_AI_AGENT_REASONING_MODEL_DEPLOYMENT_NAME=${AZURE_AI_AGENT_REASONING_MODEL_DEPLOYMENT_NAME:-gpt-6.1-sol}
      - AZURE_AI_AGENT_EMBEDDING_MODEL_DEPLOYMENT_NAME=${AZURE_AI_AGENT_EMBEDDING_MODEL_DEPLOYMENT_NAME:-text-embedding-3-large}
      - AZURE_AI_AGENT_ENDPOINT=${AZURE_AI_AGENT_ENDPOINT:-}
      - AZURE_AI_AGENT_API_VERSION=${AZURE_AI_AGENT_API_VERSION:-2025-01-01-preview}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-3072}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      # Leave API keys empty to use Entra ID (DefaultAzureCredential)
      - AZURE_OPENAI_APIKEY=${AZURE_OPENAI_APIKEY:-}
      - AZURE_TEXT_EMBEDDING_ENDPOINT=${AZURE_TEXT_EMBEDDING_ENDPOINT:-}
      - AZURE_TEXT_EMBEDDING_APIKEY=${AZURE_TEXT_EMBEDDING_APIKEY:-}
      - AZURE_TEXT_EMBEDDING_API_VERSION=${AZURE_TEXT_EMBEDDING_API_VERSION:-2024-12-01-preview}
      # Service principal credentials (optional). Alternatively mount your az login (see volumes).
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - PGHOST=${PGHOST} 
      - PGUSER=${PGUSER}
      - PGPORT=${PGPORT:-5432}
      - PGDATABASE=${PGDATABASE:-postgres}
      - PGPASSWORD=${PGPASSWORD}
      - PYTHONPATH=/app
      - LOG_LEVEL=info
    volumes:
      - ./temp:/app/temp
      - ./temp_frames:/app/temp_frames
      # To reuse your host `az login` instead of a service principal, uncomment (read-only):
      # - ${USERPROFILE:-~}/.azure:/root/.azure:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

